name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest tests/

  sast-scan:
    name: SAST Security Scan
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Che
      ckout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Bandit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bandit SAST Scan
        run: |
          bandit -r app/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt 